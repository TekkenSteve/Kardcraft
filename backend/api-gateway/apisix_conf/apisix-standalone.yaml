routes:
  # ============================================================================
  # API 路由 - APISIX 只做流量网关
  # 认证由 task-orchestrator 调用 Kratos 处理
  # ============================================================================

  # Kratos 公开 API (注册、登录、恢复等)
  -
    id: kratos-public
    uri: "/auth/*"
    upstream:
      nodes:
        "kratos:4433": 1
      type: roundrobin
      timeout:
        connect: 10
        send: 10
        read: 10
    plugins:
      proxy-rewrite:
        regex_uri: ["^/auth/(.*)", "/$1"]
      cors:
        allow_origins: "http://localhost:3000,http://127.0.0.1:3000"
        allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
        allow_headers: "Content-Type,Authorization,Cookie,X-Requested-With"
        expose_headers: "Content-Type,Set-Cookie"
        max_age: 3600
        allow_credentials: true

  # 任务相关 API 路由
  -
    id: task-api
    uri: "/api/v1/tasks*"
    upstream:
      nodes:
        "task-orchestrator:50050": 1
      type: roundrobin
      timeout:
        connect: 10
        send: 10
        read: 30
    plugins:
      cors:
        allow_origins: "http://localhost:3000,http://127.0.0.1:3000"
        allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
        allow_headers: "Content-Type,Authorization,Cookie,X-Requested-With"
        expose_headers: "Content-Type,Set-Cookie"
        max_age: 3600
        allow_credentials: true

  # Agent 相关 API 路由
  -
    id: agent-api
    uri: "/api/agents/*"
    upstream:
      nodes:
        "task-orchestrator:50050": 1
      type: roundrobin
      timeout:
        connect: 10
        send: 10
        read: 30
    plugins:
      cors:
        allow_origins: "http://localhost:3000,http://127.0.0.1:3000"
        allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
        allow_headers: "Content-Type,Authorization,Cookie,X-Requested-With"
        expose_headers: "Content-Type,Set-Cookie"
        max_age: 3600
        allow_credentials: true

  # Sessions API
  -
    id: sessions-api
    uri: "/api/v1/sessions*"
    upstream:
      nodes:
        "task-orchestrator:50050": 1
      type: roundrobin
      timeout:
        connect: 10
        send: 10
        read: 30
    plugins:
      cors:
        allow_origins: "http://localhost:3000,http://127.0.0.1:3000"
        allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
        allow_headers: "Content-Type,Authorization,Cookie,X-Requested-With"
        expose_headers: "Content-Type,Set-Cookie"
        max_age: 3600
        allow_credentials: true

  # Card Templates API
  -
    id: card-templates-api
    uris:
      - "/api/v1/card-templates"
      - "/api/v1/card-templates/*"
    upstream:
      nodes:
        "task-orchestrator:50050": 1
      type: roundrobin
      timeout:
        connect: 10
        send: 10
        read: 30
    plugins:
      cors:
        allow_origins: "http://localhost:3000,http://127.0.0.1:3000"
        allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
        allow_headers: "Content-Type,Authorization,Cookie,X-Requested-With"
        expose_headers: "Content-Type,Set-Cookie"
        max_age: 3600
        allow_credentials: true

  # Template Preference API
  -
    id: template-preferences-api
    uri: "/api/v1/users/me/template-preferences"
    upstream:
      nodes:
        "task-orchestrator:50050": 1
      type: roundrobin
      timeout:
        connect: 10
        send: 10
        read: 30
    plugins:
      cors:
        allow_origins: "http://localhost:3000,http://127.0.0.1:3000"
        allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
        allow_headers: "Content-Type,Authorization,Cookie,X-Requested-With"
        expose_headers: "Content-Type,Set-Cookie"
        max_age: 3600
        allow_credentials: true


  # Schedules API
  -
    id: schedules-api
    uri: "/api/v1/schedules*"
    upstream:
      nodes:
        "task-orchestrator:50050": 1
      type: roundrobin
      timeout:
        connect: 10
        send: 10
        read: 30
    plugins:
      cors:
        allow_origins: "http://localhost:3000,http://127.0.0.1:3000"
        allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
        allow_headers: "Content-Type,Authorization,Cookie,X-Requested-With"
        expose_headers: "Content-Type,Set-Cookie"
        max_age: 3600
        allow_credentials: true

  # Files API - Presigned URL flow via file-storage HTTP
  -
    id: files-health
    uri: "/api/v1/files/health"
    priority: 100
    upstream:
      nodes:
        "file-storage:8080": 1
      type: roundrobin
      timeout:
        connect: 5
        send: 5
        read: 5
    plugins:
      proxy-rewrite:
        uri: "/health"
      cors:
        allow_origins: "http://localhost:3000,http://127.0.0.1:3000"
        allow_methods: "GET,OPTIONS"
        allow_headers: "Content-Type,Authorization,Cookie,X-Requested-With,X-User-Id"
        expose_headers: "Content-Type,Set-Cookie"
        max_age: 3600
        allow_credentials: true

  # Files API - Presigned URL flow via file-storage HTTP
  -
    id: files-api
    uri: "/api/v1/files/*"
    upstream:
      nodes:
        "file-storage:8080": 1
      type: roundrobin
      timeout:
        connect: 10
        send: 10
        read: 60
    plugins:
      proxy-rewrite:
        regex_uri: ["^/api/(.*)", "/$1"]
      cors:
        allow_origins: "http://localhost:3000,http://127.0.0.1:3000"
        allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
        allow_headers: "Content-Type,Authorization,Cookie,X-Requested-With,X-User-Id"
        expose_headers: "Content-Type,Set-Cookie"
        max_age: 3600
        allow_credentials: true

  # Workflows API
  -
    id: workflows-api
    uri: "/api/v1/workflows/*"
    upstream:
      nodes:
        "task-orchestrator:50050": 1
      type: roundrobin
      timeout:
        connect: 10
        send: 10
        read: 30
    plugins:
      cors:
        allow_origins: "http://localhost:3000,http://127.0.0.1:3000"
        allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
        allow_headers: "Content-Type,Authorization,Cookie,X-Requested-With"
        expose_headers: "Content-Type,Set-Cookie"
        max_age: 3600
        allow_credentials: true

  # WebSocket/SSE 实时事件推送路由
  -
    id: websocket-events
    uri: "/api/events"
    upstream:
      nodes:
        "task-orchestrator:50050": 1
      type: roundrobin
      timeout:
        connect: 10
        send: 10
        read: 300
    plugins:
      cors:
        allow_origins: "http://localhost:3000,http://127.0.0.1:3000"
        allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
        allow_headers: "Content-Type,Authorization,Cookie,X-Requested-With,Upgrade,Connection"
        expose_headers: "Content-Type,Set-Cookie"
        max_age: 3600
        allow_credentials: true
      proxy-rewrite:
        headers:
          "Upgrade": "$http_upgrade"
          "Connection": "$connection_upgrade"

  # SSE 流式推送路由
  -
    id: sse-stream
    uri: "/api/v1/stream/sse"
    upstream:
      nodes:
        "task-orchestrator:50050": 1
      type: roundrobin
      timeout:
        connect: 10
        send: 10
        read: 300
    plugins:
      cors:
        allow_origins: "http://localhost:3000,http://127.0.0.1:3000"
        allow_methods: "GET,OPTIONS"
        allow_headers: "Content-Type,Authorization,Cookie,X-Requested-With"
        expose_headers: "Content-Type,Set-Cookie"
        max_age: 3600
        allow_credentials: true
      proxy-control:
        no_cache: true
        proxy_buffering: "off"

  # ============================================================================
  # 健康检查和监控路由
  # ============================================================================

  # 任务编排层健康检查
  -
    id: task-orchestrator-health
    uri: "/health/task-orchestrator"
    upstream:
      nodes:
        "task-orchestrator:50050": 1
      type: roundrobin
      timeout:
        connect: 5
        send: 5
        read: 5
    plugins:
      cors:
        allow_origins: "http://localhost:3000,http://127.0.0.1:3000"
        allow_methods: "GET"
        allow_headers: "Content-Type,Authorization,Cookie,X-Requested-With"

  # ============================================================================
  # 测试路由 (保留原有)
  # ============================================================================

  -
    id: test-route
    uri: /get
    upstream:
        nodes:
            "web1:80": 1
        type: roundrobin

# 文件尾必须写 #END，否则 APISIX 不会加载;
#END
