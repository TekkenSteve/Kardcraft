routes:
  # Kratos 公开 API (注册、登录、恢复等)
  -
    id: kratos-public
    uri: "/auth/*"
    upstream:
      nodes:
        "kratos:4433": 1
      type: roundrobin
      timeout:
        connect: 10
        send: 10
        read: 10
    plugins:
      proxy-rewrite:
        regex_uri: ["^/auth/(.*)", "/$1"]
      cors:
        allow_origins: "http://localhost:3000,http://127.0.0.1:3000"
        allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
        allow_headers: "Content-Type,Authorization,Cookie,X-Requested-With"
        expose_headers: "Content-Type,Set-Cookie"
        max_age: 3600
        allow_credentials: true

  # 任务编排层健康检查（不走鉴权代理）
  -
    id: task-orchestrator-health
    uri: "/health/task-orchestrator"
    upstream:
      nodes:
        "task-orchestrator:50050": 1
      type: roundrobin
      timeout:
        connect: 5
        send: 5
        read: 5
    plugins:
      cors:
        allow_origins: "http://localhost:3000,http://127.0.0.1:3000"
        allow_methods: "GET"
        allow_headers: "Content-Type,Authorization,Cookie,X-Requested-With"

  # 文件服务健康检查（不走鉴权代理）
  -
    id: files-health
    uri: "/api/v1/files/health"
    priority: 3000
    upstream:
      nodes:
        "file-storage:8080": 1
      type: roundrobin
      timeout:
        connect: 5
        send: 5
        read: 5
    plugins:
      proxy-rewrite:
        uri: "/health"
      cors:
        allow_origins: "http://localhost:3000,http://127.0.0.1:3000"
        allow_methods: "GET,OPTIONS"
        allow_headers: "Content-Type,Authorization,Cookie,X-Requested-With"
        expose_headers: "Content-Type,Set-Cookie"
        max_age: 3600
        allow_credentials: true

  # SSE 路由（受保护，统一进入 Oathkeeper）
  -
    id: protected-sse
    uri: "/api/v1/stream/sse"
    priority: 2000
    upstream:
      nodes:
        "oathkeeper:4455": 1
      type: roundrobin
      timeout:
        connect: 10
        send: 10
        read: 300
    plugins:
      proxy-rewrite:
        host: "kardcraft.local"
      cors:
        allow_origins: "http://localhost:3000,http://127.0.0.1:3000"
        allow_methods: "GET,OPTIONS"
        allow_headers: "Content-Type,Authorization,Cookie,X-Requested-With"
        expose_headers: "Content-Type,Set-Cookie"
        max_age: 3600
        allow_credentials: true
      proxy-control:
        no_cache: true
        proxy_buffering: false

  # 受保护 API 统一路由：所有 /api/* 请求都经 Oathkeeper 鉴权并注入身份头
  -
    id: protected-files-api
    uri: "/api/v1/files/*"
    priority: 1500
    upstream:
      nodes:
        "oathkeeper:4455": 1
      type: roundrobin
      timeout:
        connect: 10
        send: 10
        read: 120
    plugins:
      proxy-rewrite:
        host: "kardcraft-files.local"
      cors:
        allow_origins: "http://localhost:3000,http://127.0.0.1:3000"
        allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
        allow_headers: "Content-Type,Authorization,Cookie,X-Requested-With,Idempotency-Key"
        expose_headers: "Content-Type,Set-Cookie,Content-Disposition"
        max_age: 3600
        allow_credentials: true

  # 受保护 API 统一路由：其余 /api/* 请求都经 Oathkeeper 鉴权并注入身份头
  -
    id: protected-api
    uri: "/api/*"
    priority: 1000
    upstream:
      nodes:
        "oathkeeper:4455": 1
      type: roundrobin
      timeout:
        connect: 10
        send: 10
        read: 120
    plugins:
      proxy-rewrite:
        host: "kardcraft.local"
      cors:
        allow_origins: "http://localhost:3000,http://127.0.0.1:3000"
        allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
        allow_headers: "Content-Type,Authorization,Cookie,X-Requested-With,Idempotency-Key"
        expose_headers: "Content-Type,Set-Cookie,Content-Disposition"
        max_age: 3600
        allow_credentials: true

  # 测试路由
  -
    id: test-route
    uri: /get
    upstream:
      nodes:
        "web1:80": 1
      type: roundrobin

# 文件尾必须写 #END，否则 APISIX 不会加载;
#END
