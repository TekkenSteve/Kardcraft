// Agent工作流服务 gRPC 定义
syntax = "proto3";

package kardcraft.agent;

option go_package = "github.com/kardcraft/backend/agent-workflow/pb";

// Agent工作流服务
service AgentWorkflowService {
  // 执行工作流
  rpc ExecuteWorkflow(ExecuteWorkflowRequest) returns (stream WorkflowEvent);
  
  // 获取工作流状态
  rpc GetWorkflowStatus(GetWorkflowStatusRequest) returns (GetWorkflowStatusResponse);
  
  // 停止工作流
  rpc StopWorkflow(StopWorkflowRequest) returns (StopWorkflowResponse);
  
  // 列出可用的工作流
  rpc ListWorkflows(ListWorkflowsRequest) returns (ListWorkflowsResponse);
  
  // 获取工作流历史
  rpc GetWorkflowHistory(GetWorkflowHistoryRequest) returns (GetWorkflowHistoryResponse);
  
  // 保存检查点
  rpc SaveCheckpoint(SaveCheckpointRequest) returns (SaveCheckpointResponse);
  
  // 恢复检查点
  rpc RestoreCheckpoint(RestoreCheckpointRequest) returns (RestoreCheckpointResponse);
}

// 工作流状态枚举
enum WorkflowStatus {
  WORKFLOW_STATUS_UNSPECIFIED = 0;
  WORKFLOW_STATUS_PENDING = 1;
  WORKFLOW_STATUS_RUNNING = 2;
  WORKFLOW_STATUS_COMPLETED = 3;
  WORKFLOW_STATUS_FAILED = 4;
  WORKFLOW_STATUS_CANCELLED = 5;
  WORKFLOW_STATUS_PAUSED = 6;
}

// 工作流事件类型
enum WorkflowEventType {
  WORKFLOW_EVENT_TYPE_UNSPECIFIED = 0;
  WORKFLOW_EVENT_TYPE_STARTED = 1;
  WORKFLOW_EVENT_TYPE_PROGRESS = 2;
  WORKFLOW_EVENT_TYPE_COMPLETED = 3;
  WORKFLOW_EVENT_TYPE_FAILED = 4;
  WORKFLOW_EVENT_TYPE_CANCELLED = 5;
  WORKFLOW_EVENT_TYPE_LOG = 6;
  WORKFLOW_EVENT_TYPE_CHECKPOINT = 7;
}

// 工作流定义
message WorkflowDefinition {
  string id = 1;
  string name = 2;
  string description = 3;
  string version = 4;
  repeated string tags = 5;
  map<string, string> parameters = 6;
  string graph_definition = 7;  // JSON格式的LangGraph定义
  int64 created_at = 8;
  int64 updated_at = 9;
}

// 工作流实例
message WorkflowInstance {
  string id = 1;
  string workflow_id = 2;
  string name = 3;
  WorkflowStatus status = 4;
  string user_id = 5;
  string sandbox_id = 6;
  map<string, string> input_parameters = 7;
  map<string, string> output_results = 8;
  map<string, string> metadata = 9;
  string error_message = 10;
  int32 progress = 11;
  int64 created_at = 12;
  int64 started_at = 13;
  int64 completed_at = 14;
  string checkpoint_id = 15;
}

// 工作流事件
message WorkflowEvent {
  string id = 1;
  string workflow_instance_id = 2;
  WorkflowEventType type = 3;
  string message = 4;
  map<string, string> data = 5;
  int32 progress = 6;
  int64 timestamp = 7;
  string node_id = 8;  // 当前执行的节点ID
  string node_name = 9;  // 当前执行的节点名称
}

// 执行工作流请求
message ExecuteWorkflowRequest {
  string workflow_id = 1;
  string name = 2;
  string user_id = 3;
  string sandbox_id = 4;
  map<string, string> input_parameters = 5;
  map<string, string> metadata = 6;
  string checkpoint_id = 7;  // 可选：从检查点恢复
}

// 获取工作流状态请求
message GetWorkflowStatusRequest {
  string instance_id = 1;
  string user_id = 2;
}

// 获取工作流状态响应
message GetWorkflowStatusResponse {
  WorkflowInstance instance = 1;
}

// 停止工作流请求
message StopWorkflowRequest {
  string instance_id = 1;
  string user_id = 2;
  string reason = 3;
}

// 停止工作流响应
message StopWorkflowResponse {
  WorkflowInstance instance = 1;
}

// 列出工作流请求
message ListWorkflowsRequest {
  string user_id = 1;
  repeated string tags = 2;
  int32 page = 3;
  int32 page_size = 4;
}

// 列出工作流响应
message ListWorkflowsResponse {
  repeated WorkflowDefinition workflows = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

// 获取工作流历史请求
message GetWorkflowHistoryRequest {
  string user_id = 1;
  string sandbox_id = 2;
  string workflow_id = 3;
  WorkflowStatus status = 4;
  int32 page = 5;
  int32 page_size = 6;
  string order_by = 7;
}

// 获取工作流历史响应
message GetWorkflowHistoryResponse {
  repeated WorkflowInstance instances = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

// 检查点信息
message Checkpoint {
  string id = 1;
  string workflow_instance_id = 2;
  string name = 3;
  string description = 4;
  string state_data = 5;  // JSON格式的状态数据
  string node_id = 6;  // 检查点所在的节点
  map<string, string> metadata = 7;
  int64 created_at = 8;
}

// 保存检查点请求
message SaveCheckpointRequest {
  string workflow_instance_id = 1;
  string name = 2;
  string description = 3;
  string state_data = 4;
  string node_id = 5;
  map<string, string> metadata = 6;
}

// 保存检查点响应
message SaveCheckpointResponse {
  Checkpoint checkpoint = 1;
}

// 恢复检查点请求
message RestoreCheckpointRequest {
  string checkpoint_id = 1;
  string user_id = 2;
  map<string, string> override_parameters = 3;
}

// 恢复检查点响应
message RestoreCheckpointResponse {
  WorkflowInstance instance = 1;
}