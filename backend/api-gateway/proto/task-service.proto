// 任务服务 gRPC 定义
syntax = "proto3";

package kardcraft.task;

option go_package = "github.com/kardcraft/backend/task-orchestrator/pb";

// 任务服务
service TaskService {
  // 创建任务
  rpc CreateTask(CreateTaskRequest) returns (CreateTaskResponse);
  
  // 获取任务详情
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse);
  
  // 列出任务
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
  
  // 更新任务状态
  rpc UpdateTaskStatus(UpdateTaskStatusRequest) returns (UpdateTaskStatusResponse);
  
  // 取消任务
  rpc CancelTask(CancelTaskRequest) returns (CancelTaskResponse);
  
  // 删除任务
  rpc DeleteTask(DeleteTaskRequest) returns (DeleteTaskResponse);
  
  // 获取任务日志
  rpc GetTaskLogs(GetTaskLogsRequest) returns (stream TaskLogEntry);
}

// 任务状态枚举
enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_STATUS_PENDING = 1;
  TASK_STATUS_RUNNING = 2;
  TASK_STATUS_COMPLETED = 3;
  TASK_STATUS_FAILED = 4;
  TASK_STATUS_CANCELLED = 5;
}

// 任务类型枚举
enum TaskType {
  TASK_TYPE_UNSPECIFIED = 0;
  TASK_TYPE_DOCUMENT_ANALYSIS = 1;
  TASK_TYPE_KNOWLEDGE_EXTRACTION = 2;
  TASK_TYPE_ANKI_GENERATION = 3;
  TASK_TYPE_WORKFLOW_EXECUTION = 4;
}

// 任务信息
message Task {
  string id = 1;
  string name = 2;
  string description = 3;
  TaskType type = 4;
  TaskStatus status = 5;
  string user_id = 6;
  string sandbox_id = 7;
  map<string, string> parameters = 8;
  map<string, string> metadata = 9;
  int64 created_at = 10;
  int64 updated_at = 11;
  int64 started_at = 12;
  int64 completed_at = 13;
  string error_message = 14;
  int32 progress = 15;
}

// 创建任务请求
message CreateTaskRequest {
  string name = 1;
  string description = 2;
  TaskType type = 3;
  string user_id = 4;
  string sandbox_id = 5;
  map<string, string> parameters = 6;
  map<string, string> metadata = 7;
}

// 创建任务响应
message CreateTaskResponse {
  Task task = 1;
}

// 获取任务请求
message GetTaskRequest {
  string id = 1;
  string user_id = 2;
}

// 获取任务响应
message GetTaskResponse {
  Task task = 1;
}

// 列出任务请求
message ListTasksRequest {
  string user_id = 1;
  string sandbox_id = 2;
  TaskStatus status = 3;
  TaskType type = 4;
  int32 page = 5;
  int32 page_size = 6;
  string order_by = 7;
}

// 列出任务响应
message ListTasksResponse {
  repeated Task tasks = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

// 更新任务状态请求
message UpdateTaskStatusRequest {
  string id = 1;
  TaskStatus status = 2;
  string error_message = 3;
  int32 progress = 4;
  map<string, string> metadata = 5;
}

// 更新任务状态响应
message UpdateTaskStatusResponse {
  Task task = 1;
}

// 取消任务请求
message CancelTaskRequest {
  string id = 1;
  string user_id = 2;
  string reason = 3;
}

// 取消任务响应
message CancelTaskResponse {
  Task task = 1;
}

// 删除任务请求
message DeleteTaskRequest {
  string id = 1;
  string user_id = 2;
}

// 删除任务响应
message DeleteTaskResponse {
  bool success = 1;
}

// 获取任务日志请求
message GetTaskLogsRequest {
  string task_id = 1;
  string user_id = 2;
  int64 since = 3;
  int32 limit = 4;
}

// 任务日志条目
message TaskLogEntry {
  string id = 1;
  string task_id = 2;
  string level = 3;
  string message = 4;
  map<string, string> metadata = 5;
  int64 timestamp = 6;
}