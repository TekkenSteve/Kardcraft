[project]
name = "lightrag-multitenant-server"
version = "0.1.0"
description = "Multi-workspace pooling gateway for LightRAG-compatible API"
requires-python = ">=3.11"
dependencies = [
  "cachetools>=7.0.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "uvicorn>=0.32.0",
  "lightrag-hku[api]>=1.4.13",
  "redis>=5.0.0",
  "neo4j>=5.20.0",
  "pymilvus>=2.6.0",
]

[project.scripts]
lightrag-mt = "multitenant_lightrag.__main__:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
