[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kardcraft-agent-workflow"
version = "1.0.0"
description = "Kardcraft Agent Workflow Service"
authors = [{name = "Kardcraft Team"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11,<3.14"
dependencies = [
    "grpcio>=1.77.0",
    "protobuf>=6.33.2,<7.0.0",
    "langgraph>=1.1.0",
    "langchain>=1.2.10",
    "langchain-openai>=1.1.6",
    "langchain-anthropic>=1.3.0",
    "pydantic>=2.12",
    "pydantic-settings>=2.10.0",
    "redis>=7.1.0",
    "asyncpg>=0.31.0",
    "sqlalchemy>=2.0.0",
    "aioredis>=2.0.1",
    "aiohttp>=3.13.2",
    "minio>=7.2.20",
    "pymilvus>=2.6.9",
    "neo4j>=6.0.0",
    "psycopg[binary]>=3.3.2",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.40.1",
    "fastapi>=0.130.0",
    "prometheus-client>=0.24.1",
    "structlog>=25.5.0",
    "tenacity>=9.1.2",
    "backoff>=2.2.1",
    "circuitbreaker>=2.1.3",
    "deepagents>=0.4.1",  # MCP/Skill 工具集成
    "deepagents-cli>=0.0.25",  # Skill 加载器
    "langchain-mcp-adapters>=0.2.1",  # MCP 适配器
    "tavily-python>=0.7.0",  # Tavily search API
    "httpx>=0.28.1",  # HTTP client for web requests
    "markdownify>=1.2.0",  # HTML to Markdown conversion
    "pyyaml>=6.0",  # YAML 解析
    "temporalio>=1.21.0",  # Temporal Python SDK (currently requires protobuf < 7)
    "dspy>=3.1.2",  # DSPy for prompt optimization
    "langfuse>=4.0.0",  # Prompt management and monitoring
    "litellm>=1.80.15",  # Unified LLM API for multiple providers
    "python-frontmatter>=1.1.0",  # Markdown frontmatter parsing
    # "kardcraft-ragix @ file://./src/kardcraft/ragix"
    "python-dotenv>=1.0.1",
    "rich>=13.7.1",
    "orjson>=3.11.0",
    # ========== Ragix 解析器依赖 ==========
    "docling>=2.80.0",  # Office 文档解析
    "pymupdf>=1.25.0",  # PDF 处理
    "pillow>=10.0.0",  # 图像处理
    "requests>=2.31.0",  # HTTP 请求
    "gotenberg-client>=0.14.0",  # Gotenberg Python SDK
    "pydantic-monty>=0.0.8,<0.1.0",
    "dnspython>=2.8.0,<2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
    "pre-commit>=3.5.0",
    "ipython>=8.17.0",
    "jupyter>=1.0.0",
]

[project.scripts]
sandbox-broker = "kardcraft.sandbox_broker.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.ruff]
target-version = "py39"
line-length = 88
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--verbose --strict-markers --strict-config"
asyncio_mode = "auto"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]

# [tool.uv.sources]
# ragix = { workspace = true }
# 
# [tool.uv.workspace]
# members = ["src/kardcraft/ragix"]

[project.urls]
Homepage = "https://github.com/kardcraft/kardcraft"
Repository = "https://github.com/kardcraft/kardcraft"
Documentation = "https://docs.kardcraft.com"
"Bug Tracker" = "https://github.com/kardcraft/kardcraft/issues"
