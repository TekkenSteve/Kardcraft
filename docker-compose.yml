  # ============================================================================
  # Network Configuration
  # ============================================================================

networks:
  kardcraft-network:
    driver: bridge

# ============================================================================
# Volume Configuration
# ============================================================================

volumes:
  redis-data:
    driver: local
  postgres-data:
    driver: local
  minio-data:
    driver: local
  milvus-data:
    driver: local
  etcd-data:
    driver: local
  neo4j-data:
    driver: local
  neo4j-logs:
    driver: local
  agent-workflow-storage:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  pgadmin-data:
    driver: local

# ============================================================================
# Instructions for use
# ============================================================================

# 1. Start all services:
#    docker-compose up -d
#
# 2. Start only core services:
#    docker-compose up -d redis postgres minio milvus
#
# 3. Start business services:
#    docker-compose up -d api-gateway task-orchestrator agent-workflow file-storage
#
# 4. View logs:
#    docker-compose logs -f agent-workflow
#
# 5. Stop services:
#    docker-compose down
#
# 6. Stop and remove data:
#    docker-compose down -v

