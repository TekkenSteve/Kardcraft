# ============================================================================
# Kardcraft Complete Development Environment Docker Compose Configuration
# ============================================================================
services:
  # ============================================================================
  # Core Services
  # ============================================================================

  # Redis Service
  redis:
    image: redis:7-alpine
    container_name: kardcraft-redis
    restart: always
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    command: redis-server --appendonly yes --requirepass redis123
    volumes:
      - redis-data:/data
    networks:
      - kardcraft-network
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5

  # PostgreSQL Service
  postgres:
    image: postgres:15-alpine
    container_name: kardcraft-postgres
    restart: always
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      - POSTGRES_DB=kardcraft
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres123
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - kardcraft-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  db-migrate:
    image: postgres:15-alpine
    container_name: kardcraft-db-migrate
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=kardcraft
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres123
    volumes:
      - ./backend/database:/migrations:ro
    command: [ "/bin/sh", "/migrations/scripts/migrate.sh" ]
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kardcraft-network

  # Ory Kratos Database Table Structure Migration Service - One-Time Task
  # Migration is idempotent, running it multiple times will not cause issues
  # When upgrading Kratos in the production environment, the migration will automatically handle table structure changes
  # You can use kratos migrate sql status to check the migration status
  kratos-migrate:
    image: oryd/kratos:v25.4.0
    container_name: kardcraft-kratos-migrate
    environment:
      DSN: ${KRATOS_DSN:?set KRATOS_DSN}
      SECRETS_COOKIE: '["${KRATOS_COOKIE_SECRET:?set KRATOS_COOKIE_SECRET}"]'
      SECRETS_CIPHER: '["${KRATOS_CIPHER_SECRET:?set KRATOS_CIPHER_SECRET}"]'
    volumes:
      - ./backend/auth-gateway/kratos/email-password:/etc/config/kratos
    command: -c /etc/config/kratos/kratos.yml migrate sql -e --yes
    restart: on-failure # Migration failed when retrying  
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kardcraft-network

  kratos:
    image: oryd/kratos:v25.4.0
    container_name: kardcraft-kratos
    restart: always
    ports:
      - "${KRATOS_PUBLIC_HOST_PORT:-4433}:4433" # Public API
      - "${KRATOS_ADMIN_HOST_PORT:-4434}:4434" # Admin API https://github.com/ory/kratos/blob/791b0d59/internal/httpclient/README.md
    environment:
      KRATOS_ENV: ${KRATOS_ENV:-dev}
      DSN: ${KRATOS_DSN:?set KRATOS_DSN}
      LOG_LEVEL: ${KRATOS_LOG_LEVEL:-debug}
      LOG_LEAK_SENSITIVE_VALUES: "false"
      COURIER_SMTP_CONNECTION_URI: ${KRATOS_SMTP_CONNECTION_URI:?set KRATOS_SMTP_CONNECTION_URI}
      HASHERS_BCRYPT_COST: ${KRATOS_BCRYPT_COST:-12}
      SECRETS_COOKIE: '["${KRATOS_COOKIE_SECRET:?set KRATOS_COOKIE_SECRET}"]'
      SECRETS_CIPHER: '["${KRATOS_CIPHER_SECRET:?set KRATOS_CIPHER_SECRET}"]'
    command: ["serve", "-c", "/etc/config/kratos/kratos.yml", "-c", "/etc/config/kratos/kratos.dev.yml", "--watch-courier"]
    entrypoint: ["/etc/config/kratos/start-kratos.sh"]
    # Production environment: serve -c /etc/config/kratos/kratos.yml
    volumes:
      - ./backend/auth-gateway/kratos/email-password:/etc/config/kratos
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:4433/health/ready" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - kardcraft-network

  oathkeeper:
    image: oryd/oathkeeper:v26.2.0
    container_name: kardcraft-oathkeeper
    restart: always
    command: serve --config /etc/config/oathkeeper/oathkeeper.yml
    ports:
      - "${OATHKEEPER_PROXY_HOST_PORT:-4455}:4455"
      - "${OATHKEEPER_API_HOST_PORT:-4456}:4456"
    volumes:
      - ./backend/auth-gateway/oathkeeper:/etc/config/oathkeeper:ro
    depends_on:
      kratos:
        condition: service_healthy
      task-orchestrator:
        condition: service_started
      file-storage:
        condition: service_started
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:4456/health/ready" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - kardcraft-network

  mailslurper:
    image: oryd/mailslurper:latest-smtps
    ports:
      - "${MAILSLURPER_SMTP_HOST_PORT:-4436}:4436" # SMTP Port  
      - "${MAILSLURPER_WEB_HOST_PORT:-4437}:4437" # Web Interface Port /mail
    networks:
      - kardcraft-network

  # MinIO Object Storage
  minio:
    # image: minio/minio:RELEASE.2023-03-20T20-16-18Z 
    image: minio/minio:latest
    container_name: kardcraft-minio
    restart: always
    ports:
      - "${MINIO_API_HOST_PORT:-9000}:9000" # API Port
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001" # Console Port
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - kardcraft-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 3s
      retries: 5

  # Milvus Vector Database
  milvus:
    image: milvusdb/milvus:v2.5.5
    container_name: kardcraft-milvus
    restart: always
    ports:
      - "${MILVUS_GRPC_HOST_PORT:-19530}:19530"
      - "${MILVUS_HTTP_HOST_PORT:-9091}:9091"
    environment:
      - ETCD_ENDPOINTS=etcd:2379
      - MINIO_ADDRESS=minio:9000
      - CLUSTER_ENABLED=false
      - COMMON_STORAGETYPE=minio
    command: [ "milvus", "run", "standalone" ]
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      - etcd
      - minio
    networks:
      - kardcraft-network

  # LightRAG multi-tenant gateway (official API-compatible entry)
  lightrag:
    build:
      context: ./backend/lightrag/multitenant_server
      dockerfile: Dockerfile
    container_name: kardcraft-lightrag
    ports:
      - "${LIGHTRAG_HOST_PORT:-9621}:9621"
    environment:
      - LIGHTRAG_PROCESS_CMD=/app/.venv/bin/lightrag-server
      - LIGHTRAG_PROCESS_STARTUP_TIMEOUT_SEC=420
      - LIGHTRAG_MT_LOG_LEVEL=debug
      - LIGHTRAG_TEMPLATE_ENV_FILE=/app/.env
      - LIGHTRAG_WORKSPACES_ROOT=/data/lightrag_workspaces
      - LIGHTRAG_GLOBAL_MAX_INFLIGHT=${LIGHTRAG_GLOBAL_MAX_INFLIGHT:-128}
      - LIGHTRAG_PER_WORKSPACE_MAX_INFLIGHT=${LIGHTRAG_PER_WORKSPACE_MAX_INFLIGHT:-16}
      - LIGHTRAG_POOL_SIZE_PER_WORKSPACE=${LIGHTRAG_POOL_SIZE_PER_WORKSPACE:-4}
      - LIGHTRAG_MAX_WORKSPACE_COUNT=${LIGHTRAG_MAX_WORKSPACE_COUNT:-1}
      - LIGHTRAG_WORKSPACE_IDLE_TTL_SEC=${LIGHTRAG_WORKSPACE_IDLE_TTL_SEC:-1800}
      - LIGHTRAG_BORROW_TIMEOUT_SEC=${LIGHTRAG_BORROW_TIMEOUT_SEC:-10}
    volumes:
      - ./.env.lightrag:/app/.env:ro
      - ./data/lightrag_workspaces:/data/lightrag_workspaces
      - ./config.ini:/app/config.ini
    restart: always
    depends_on:
      neo4j:
        condition: service_healthy
      milvus:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - kardcraft-network

  # Gotenberg (Office -> PDF conversion)
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: kardcraft-gotenberg
    restart: always
    ports:
      - "${GOTENBERG_HOST_PORT:-3333}:3000"
    command:
      - "gotenberg"
      - "--api-port=3000"
      - "--api-timeout=120s"
      - "--libreoffice-start-timeout=120s"
      - "--libreoffice-restart-after=20"
    networks:
      - kardcraft-network

  # PageIndex removed (custom implementation will live in agent)

  etcd:
    image: quay.io/coreos/etcd:v3.6.7
    container_name: kardcraft-etcd
    restart: always
    ports:
      - "${ETCD_CLIENT_HOST_PORT:-2379}:2379/tcp"
      - "${ETCD_PEER_HOST_PORT:-2380}:2380"
    environment:
      ETCD_ENABLE_V2: "true"
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_ADVERTISE_CLIENT_URLS: "http://etcd:2379"
      ETCD_LISTEN_CLIENT_URLS: "http://0.0.0.0:2379"
      # - ETCD_AUTO_COMPACTION_MODE=revision
      # - ETCD_AUTO_COMPACTION_RETENTION=1000
      # - ETCD_QUOTA_BACKEND_BYTES=4294967296
      # - ETCD_SNAPSHOT_COUNT=50000
      # - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      # - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
      # - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380
      # - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://etcd:2380
      # - ETCD_INITIAL_CLUSTER=etcd=http://etcd:2380
      # - ETCD_NAME=etcd
      # - ETCD_DATA_DIR=/etcd-data
    volumes:
      - etcd-data:/etcd-data
    networks:
      - kardcraft-network
    healthcheck:
      test: [ "CMD", "etcdctl", "endpoint", "health" ]
      interval: 10s
      timeout: 3s
      retries: 5

  # MongoDB (主业务存储)
  # mongodb:
  #   image: mongo:8.0
  #   container_name: kardcraft-mongodb
  #   restart: always
  #   ports:
  #     - "27017:27017"
  #   environment:
  #     - MONGO_INITDB_ROOT_USERNAME=root
  #     - MONGO_INITDB_ROOT_PASSWORD=mongo123
  #   volumes:
  #     - mongodb-data:/data/db
  #   networks:
  #     - kardcraft-network
  #   # command: ["--bind_ip_all"]
  #   healthcheck:
  #     test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 3

  # Neo4j 图数据库
  neo4j:
    image: neo4j:5.26
    container_name: kardcraft-neo4j
    restart: always
    ports:
      - "${NEO4J_HTTP_HOST_PORT:-7474}:7474" # HTTP 端口
      - "${NEO4J_BOLT_HOST_PORT:-7687}:7687" # Bolt 端口
    environment:
      - NEO4J_AUTH=${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-neo4j123}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_memory_pagecache_size=1G
      - NEO4J_server_bolt_listen__address=0.0.0.0:7687
      - NEO4J_server_http_listen__address=0.0.0.0:7474
      # - ENTITY_EMBEDDING=true
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    networks:
      - kardcraft-network
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      start_period: 40s
      interval: 15s
      timeout: 10s
      retries: 5

  # Temporal服务
  temporal:
    image: temporalio/auto-setup:latest
    container_name: kardcraft-temporal
    restart: always
    ports:
      - "${TEMPORAL_GRPC_HOST_PORT:-7233}:7233" # Temporal gRPC
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_SEEDS=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PWD=postgres123
    depends_on:
      - postgres
    networks:
      - kardcraft-network

  temporal-ui:
    image: temporalio/ui:latest
    container_name: kardcraft-temporal-ui
    restart: always
    ports:
      - "${TEMPORAL_UI_HOST_PORT:-8233}:8080" # Fix: Temporal Web UI standard port
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      - temporal
    networks:
      - kardcraft-network

  # ============================================================================
  # Business services
  # ============================================================================

  # APIGateway layer (APISIX)
  api-gateway:
    image: apache/apisix:${APISIX_IMAGE_TAG:-3.14.1-debian}
    container_name: kardcraft-api-gateway
    environment:
      - TZ=Asia/Shanghai
    restart: always
    ports:
      - "${APISIX_ADMIN_HOST_PORT:-9180}:9180/tcp" # Admin API
      - "${APISIX_HTTP_HOST_PORT:-9080}:9080/tcp"
      - "${APISIX_PLUGIN_HOST_PORT:-9093}:9091/tcp" # plugin
      - "${APISIX_HTTPS_HOST_PORT:-9443}:9443/tcp"
      - "${APISIX_CONTROL_HOST_PORT:-9092}:9092/tcp"
    volumes:
      # 单体
      - ./backend/api-gateway/apisix_conf/apisix-standalone.yaml:/usr/local/apisix/conf/apisix.yaml:ro
      - ./backend/api-gateway/apisix_conf/config-standalone.yaml:/usr/local/apisix/conf/config.yaml:ro
      # 集群
      # - ./backend/api-gateway/apisix_conf/config.yaml:/usr/local/apisix/conf/config.yaml:ro
    depends_on:
      ##Cluster configuration requires etcd support
      # - etcd
      kratos:
        condition: service_healthy
      oathkeeper:
        condition: service_healthy
    networks:
      - kardcraft-network

  web1:
    image: nginx:1.19.0-alpine
    restart: always
    volumes:
      - ./backend/api-gateway/upstream/web1.conf:/etc/nginx/nginx.conf
    ports:
      - "${WEB1_HOST_PORT:-9081}:80/tcp"
    environment:
      - NGINX_PORT=80
    networks:
      - kardcraft-network

  # Task Orchestration Layer (Go)
  task-orchestrator:
    build:
      context: ./backend/task-orchestrator
      dockerfile: Dockerfile
      additional_contexts:
        goagent: ${GOAGENT_SOURCE_PATH:-../GoAgent}
    container_name: kardcraft-task-orchestrator
    restart: always
    command: [ /app/task-orchestrator ]
    env_file:
      - ${PWD}/.env.llm
    ports:
      - "${TASK_ORCHESTRATOR_HOST_PORT:-50050}:50050" # HTTP port for orchestrator (used by frontend/APISIX)
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=kardcraft
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres123
      - POSTGRES_SSLMODE=disable
      - REDIS_PASSWORD=redis123
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=kardcraft
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres123
      - ENABLE_TEMPORAL=true
      - TEMPORAL_ENDPOINT=temporal:7233
      - AGENT_WORKFLOW_BACKEND_NAME=${AGENT_WORKFLOW_BACKEND_NAME:?AGENT_WORKFLOW_BACKEND_NAME is required}
      - AGENT_WORKFLOW_TASK_QUEUE=${AGENT_WORKFLOW_TASK_QUEUE:?AGENT_WORKFLOW_TASK_QUEUE is required}
      - AGENT_WORKFLOW_TYPE=${AGENT_WORKFLOW_TYPE:?AGENT_WORKFLOW_TYPE is required}
      - KARDCRAFT_SCHEDULE_CATCHUP_WINDOW=${KARDCRAFT_SCHEDULE_CATCHUP_WINDOW:?KARDCRAFT_SCHEDULE_CATCHUP_WINDOW is required}
      - KARDCRAFT_SCHEDULE_DELIVERY_TIMEOUT=${KARDCRAFT_SCHEDULE_DELIVERY_TIMEOUT:?KARDCRAFT_SCHEDULE_DELIVERY_TIMEOUT is required}
      - KARDCRAFT_SCHEDULE_RETRY_INITIAL_INTERVAL=${KARDCRAFT_SCHEDULE_RETRY_INITIAL_INTERVAL:?KARDCRAFT_SCHEDULE_RETRY_INITIAL_INTERVAL is required}
      - KARDCRAFT_SCHEDULE_RETRY_MAXIMUM_INTERVAL=${KARDCRAFT_SCHEDULE_RETRY_MAXIMUM_INTERVAL:?KARDCRAFT_SCHEDULE_RETRY_MAXIMUM_INTERVAL is required}
      - KARDCRAFT_SCHEDULE_RETRY_BACKOFF_COEFFICIENT=${KARDCRAFT_SCHEDULE_RETRY_BACKOFF_COEFFICIENT:?KARDCRAFT_SCHEDULE_RETRY_BACKOFF_COEFFICIENT is required}
      - KARDCRAFT_SCHEDULE_RETRY_MAXIMUM_ATTEMPTS=${KARDCRAFT_SCHEDULE_RETRY_MAXIMUM_ATTEMPTS:?KARDCRAFT_SCHEDULE_RETRY_MAXIMUM_ATTEMPTS is required}
      - ANKI_RUNTIME_URL=http://anki-runtime:8012
    volumes:
      - ./backend/task-orchestrator/config.yaml:/app/config.yaml
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_started
      anki-runtime:
        condition: service_healthy
      agent-workflow:
        condition: service_started
    # Distroless image has no shell/wget/curl; disable in-container healthcheck.
    healthcheck:
      disable: true
    networks:
      - kardcraft-network

  # Agent Workflow layer (Python)
  agent-workflow:
    image: kardcraft-agent-workflow
    build:
      context: ./backend/agent-workflow
      dockerfile: Dockerfile
    container_name: kardcraft-agent-workflow
    env_file:
      - ${PWD}/.env.llm
      - ${PWD}/.env.ragix
    restart: always
    command: ["python", "-m", "kardcraft.temporal.worker"]
    # ports removed since it's a consumer
    environment:
      # Basic service configuration
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_PASSWORD=redis123
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=kardcraft
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres123
      - TEMPORAL_ENDPOINT=temporal:7233
      - AGENT_WORKFLOW_TASK_QUEUE=${AGENT_WORKFLOW_TASK_QUEUE:?AGENT_WORKFLOW_TASK_QUEUE is required}
      - TASK_ORCHESTRATOR_BASE_URL=${TASK_ORCHESTRATOR_BASE_URL:?TASK_ORCHESTRATOR_BASE_URL is required}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_SECURE=false
      - MILVUS_HOST=milvus
      - TAVILY_API_KEY=${TAVILY_API_KEY:-enter-your-key} # Tavily API Key
      - MILVUS_PORT=19530
      - LOGGING_LEVEL=DEBUG
      - LIGHTRAG_BASE_URL=http://lightrag:9621
      - ANKI_RUNTIME_URL=http://anki-runtime:8012
      - SANDBOX_BROKER_TARGET=sandbox-broker:50061
    volumes:
      - agent-workflow-storage:/app/storage
      - /data/kardcraft:/data/kardcraft
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started
      milvus:
        condition: service_started
      lightrag:
        condition: service_started
      anki-runtime:
        condition: service_healthy
      sandbox-broker:
        condition: service_started
    networks:
      - kardcraft-network

  # Sandbox Broker (execution control plane)
  sandbox-broker:
    build:
      context: ./backend/agent-workflow
      dockerfile: Dockerfile
    container_name: kardcraft-sandbox-broker
    env_file:
      - ${PWD}/.env.llm
      - ${PWD}/.env.ragix
    restart: always
    command: [ "python", "-m", "kardcraft.sandbox_broker.server" ]
    environment:
      - SANDBOX_BROKER_ADDR=0.0.0.0:50061
      - SANDBOX_BROKER_TARGET=sandbox-broker:50061
      - SANDBOX_BROKER_POLICY_FILE=/app/config/policy-profiles.yaml
    volumes:
      - ./backend/agent-workflow/config/policy-profiles.yaml:/app/config/policy-profiles.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - etcd
    networks:
      - kardcraft-network

  # Anki Template Rendering/Preview Service (Independent of agent-workflow)
  anki-runtime:
    build:
      context: ./backend/anki-runtime
      dockerfile: Dockerfile
    container_name: kardcraft-anki-runtime
    restart: always
    ports:
      - "${ANKI_RUNTIME_HOST_PORT:-8012}:8012"
    healthcheck:
      test: [ "CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:8012/health', timeout=3).getcode()==200 else 1)" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - kardcraft-network

  # File Storage Service (Go + MinIO)
  file-storage:
    build:
      context: ./backend/file-storage
      dockerfile: Dockerfile
      cache_from: [ kardcraft/file-storage:cache ]
    container_name: kardcraft-file-storage
    restart: always
    ports:
      - "${FILE_STORAGE_GRPC_HOST_PORT:-50053}:50053" # gRPC Port
      - "${FILE_STORAGE_HTTP_HOST_PORT:-8082}:8080" # HTTP Port (for presigned URL API)
    environment:
      - MINIO_ENDPOINT=minio:9000
      - MINIO_PUBLIC_ENDPOINT=http://localhost:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_SECURE=false
    depends_on:
      - minio
    networks:
      - kardcraft-network
  # ============================================================================
  # Development Tools
  # ============================================================================

  # pgAdmin
  # pgadmin:
  #   image: dpage/pgadmin4:latest
  #   container_name: kardcraft-pgadmin
  #   restart: always
  #   ports:
  #     - "5050:80"
  #   environment:
  #     - PGADMIN_DEFAULT_EMAIL=admin@kardcraft.com
  #     - PGADMIN_DEFAULT_PASSWORD=admin123
  #   volumes:
  #     - pgadmin-data:/var/lib/pgadmin
  #   networks:
  #     - kardcraft-network

  # # Redis Commander
  # redis-commander:
  #   image: rediscommander/redis-commander:latest
  #   container_name: kardcraft-redis-commander
  #   restart: always
  #   ports:
  #     - "8082:8081"
  #   environment:
  #     - REDIS_HOSTS=local:redis:6379
  #     - HTTP_USER=admin
  #     - HTTP_PASSWORD=admin123
  #   depends_on:
  #     - redis
  #   networks:
  #     - kardcraft-network

  # # MinIO Console (通过nginx代理)
